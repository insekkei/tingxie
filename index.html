<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>生字听写小课堂</title>
<style>
  :root{
    --bg1:#FFF9F2; --bg2:#F2F7FF;
    --card:#ffffff; --ink:#2F3A4A; --sub:#7A879B;
    --orange:#FF8A3D; --orange-d:#F2701C;
    --blue:#4C9AFF; --green:#3FBF7F; --red:#FF6B6B;
    --line:#E8EDF5; --shadow:0 8px 24px rgba(70,100,150,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Helvetica Neue","Microsoft YaHei",system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,var(--bg1),var(--bg2));
    min-height:100vh; padding:16px 14px calc(28px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto}
  h1{font-size:22px;margin:6px 0 2px;display:flex;align-items:center;gap:8px}
  .sub{color:var(--sub);font-size:13px;margin-bottom:14px}
  .card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
  .card h2{font-size:16px;margin:0 0 12px;display:flex;align-items:center;gap:8px}
  .badge{background:#FFF1E6;color:var(--orange-d);font-size:12px;padding:3px 9px;border-radius:99px;font-weight:600}
  .btn{
    border:0;border-radius:14px;padding:13px 16px;font-size:16px;font-weight:600;
    background:var(--orange);color:#fff;cursor:pointer;width:100%;transition:.15s;
  }
  .btn:active{transform:scale(.98)}
  .btn[disabled]{opacity:.45}
  .btn.blue{background:var(--blue)}
  .btn.ghost{background:#F1F5FB;color:var(--ink)}
  .btn.green{background:var(--green)}
  .btn.sm{padding:10px 12px;font-size:14px}
  .row{display:flex;gap:10px}
  .row>*{flex:1}
  label.field{display:block;font-size:13px;color:var(--sub);margin:10px 0 6px}
  input[type=number],input[type=text],textarea{
    width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:16px;
    font-family:inherit;color:var(--ink);background:#FBFCFE;outline:none;
  }
  input:focus,textarea:focus{border-color:var(--blue)}
  /* 上传区 */
  .drop{
    border:2px dashed #CFDCEF;border-radius:16px;padding:22px 14px;text-align:center;
    background:#FAFCFF;cursor:pointer;
  }
  .drop .ico{font-size:34px}
  .drop b{display:block;margin-top:6px;font-size:15px}
  .drop span{font-size:12px;color:var(--sub)}
  .prev{margin-top:12px;display:none}
  .prev img{width:100%;border-radius:12px;border:1px solid var(--line);display:block}
  .prog{height:8px;background:#EEF3FA;border-radius:99px;overflow:hidden;margin-top:10px}
  .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--orange),#FFB56B);transition:.3s}
  .note{font-size:12px;color:var(--sub);margin-top:8px;line-height:1.6}
  /* 生字 chips */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;min-height:10px}
  .chip{
    background:#FFF3E8;border:1px solid #FFD9BC;color:var(--orange-d);border-radius:12px;
    padding:7px 10px;font-size:20px;font-weight:600;display:flex;align-items:center;gap:6px;cursor:pointer;
  }
  .chip .x{
    font-size:18px;color:#C7916A;font-weight:700;line-height:1;
    padding:2px 4px;margin:-2px -4px -2px 2px;border-radius:8px;
  }
  .chip .x:active{background:#FFE3CF}
  .empty{color:var(--sub);font-size:13px}
  .sw{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
  .sw:last-child{border-bottom:0}
  .switch{width:48px;height:28px;border-radius:99px;background:#DDE5F0;position:relative;transition:.2s;flex:0 0 auto}
  .switch.on{background:var(--green)}
  .switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch.on i{left:23px}
  /* 听写界面 */
  #run{display:none}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;color:var(--sub)}
  .stage{
    background:#fff;border-radius:24px;box-shadow:var(--shadow);padding:18px 16px 20px;text-align:center;
  }
  .box{
    height:190px;border:3px dashed #D6E2F2;border-radius:20px;display:flex;align-items:center;justify-content:center;
    background:repeating-linear-gradient(45deg,#FBFCFF,#FBFCFF 14px,#F6F9FE 14px,#F6F9FE 28px);
    margin-bottom:14px;
  }
  .box .pen{font-size:54px;opacity:.55}
  .box .ans{font-size:120px;line-height:1;font-weight:700;color:var(--orange-d)}
  .hint{font-size:19px;line-height:1.7;color:#40506A;min-height:56px;font-weight:600}
  .hint .dim{color:var(--sub);font-size:15px;font-weight:400}
  .timer{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 4px}
  .ring{width:64px;height:64px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:7;stroke-linecap:round}
  .num{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
  .speaking{color:var(--green);font-size:13px;font-weight:600;height:18px}
  .ctrls{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .dots{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:14px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#DDE5F0;display:block}
  .dots i.done{background:var(--green)}
  .dots i.cur{background:var(--orange);transform:scale(1.35)}
  /* 完成 */
  #done{display:none}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin-top:12px}
  .cell{background:#FFF3E8;border-radius:14px;padding:10px 0;text-align:center;font-size:30px;font-weight:700;color:var(--orange-d);position:relative}
  .cell u{position:absolute;top:3px;left:6px;font-size:10px;color:#C7916A;text-decoration:none;font-weight:600}
  .chip.miss{background:#FFFFFF;border:2px dashed #E8543F;color:#C81E1E;font-weight:800}
  .chip.miss .x{color:#E8543F}
  .modal{position:fixed;inset:0;background:rgba(30,40,55,.45);display:none;align-items:flex-end;justify-content:center;z-index:80;padding:0}
  .modal-box{background:#fff;width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
  .modal-box h3{margin:0 0 6px;font-size:17px}
  .frow{display:flex;align-items:center;gap:8px;margin-bottom:10px}
  .frow b{font-size:26px;width:38px;text-align:center;flex:0 0 auto;color:var(--orange-d)}
  .frow input{flex:1;min-width:0}
  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:26px;background:rgba(47,58,74,.94);color:#fff;
    padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:99;max-width:90%}
  .toast.on{opacity:1;bottom:36px}
</style>
</head>
<body>
<div class="wrap">

  <h1>📝 生字听写小课堂</h1>
  <div class="sub">上传生字表照片 → 自动识别 → 逐字报听写</div>

  <!-- ========== 设置（准备） ========== -->
  <div id="setup">
    <div class="card">
      <h2>① 生字表 <span class="badge">拍照 / 相册</span></h2>
      <div class="drop" id="drop">
        <div class="ico">📷</div>
        <b>点击上传生字表图片</b>
        <span>支持手机相册、拍照；会自动去格线、逐字识别</span>
      </div>
      <input type="file" id="file" accept="image/*" hidden>
      <div class="prev" id="prev"><img id="prevImg" alt="生字表"></div>
      <div class="prog" id="ocrProg" style="display:none"><i id="ocrBar"></i></div>
      <div class="note" id="ocrMsg"></div>

      <div style="margin-top:14px">
        <label class="field">也可以直接粘贴 / 输入生字（不用图片）</label>
        <textarea id="manual" rows="2" placeholder="例如：海 天 地 人 火 水 山"></textarea>
        <div class="row" style="margin-top:10px">
          <button class="btn sm ghost" id="addManual">加入生字表</button>
          <button class="btn sm ghost" id="demo">用示例生字</button>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>② 生字清单 <span class="badge" id="cnt">0 个</span></h2>
      <div class="chips" id="chips"><span class="empty">还没有生字，先上传图片或手动输入～</span></div>
      <div class="note" id="missTip"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm" id="fillBtn" style="display:none">✏️ 补词组（没有词的字）</button>
        <button class="btn sm ghost" id="dropMissBtn" style="display:none">🧹 移除没组词的字</button>
        <button class="btn sm ghost" id="clearBtn" style="display:none">🗑 清空重来</button>
      </div>
    </div>

    <div class="card">
      <h2>③ 听写设置</h2>
      <div class="sw"><span>每个字停留时间</span><span style="display:flex;align-items:center;gap:6px">
        <input type="number" id="dur" value="15" min="4" max="60" style="width:70px;text-align:center"> 秒</span></div>
      <div class="sw"><span>随机顺序听写</span><div class="switch on" id="swShuffle"><i></i></div></div>
      <div class="sw"><span>再念一遍</span><div class="switch on" id="swTwice"><i></i></div></div>
      <div class="sw"><span>隔几秒再念第二遍</span><span style="display:flex;align-items:center;gap:6px">
        <input type="number" id="gap" value="5" min="2" max="12" style="width:70px;text-align:center"> 秒</span></div>
      <div class="sw"><span>屏幕上显示组词提示</span><div class="switch on" id="swHint"><i></i></div></div>
      <div class="sw"><span>报序号（第几个）</span><div class="switch" id="swIdx"><i></i></div></div>
      <div class="sw"><span>语速</span><span style="display:flex;align-items:center;gap:8px">
        <input type="range" id="rate" min="0.6" max="1.2" step="0.05" value="0.85" style="flex:1">
        <b id="rateV" style="width:34px;text-align:right;font-size:13px">0.85</b></span></div>
      <button class="btn" id="start" style="margin-top:14px">▶ 开始听写</button>
      <button class="btn ghost sm" id="test" style="margin-top:10px">🔊 先试听一下语音</button>
    </div>
  </div>

  <!-- ========== 听写中 ========== -->
  <div id="run">
    <div class="topbar">
      <span id="pos">第 1 / 0 个</span>
      <span id="quit" style="color:var(--red);font-weight:600;cursor:pointer">结束听写</span>
    </div>
    <div class="stage">
      <div class="box" id="box"><span class="pen" id="pen">✍️</span></div>
      <div class="hint" id="hint"></div>
      <div class="speaking" id="spk"></div>
      <div class="timer">
        <svg class="ring" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" stroke="#EEF3FA" stroke-width="7"></circle>
          <circle id="ring" cx="32" cy="32" r="27" stroke="#FF8A3D" stroke-dasharray="169.6" stroke-dashoffset="0"></circle>
        </svg>
        <span class="num" id="num">10</span>
      </div>
      <div class="ctrls">
        <button class="btn sm ghost" id="repeat">🔊 再读一遍</button>
        <button class="btn sm ghost" id="pause">⏸ 暂停</button>
        <button class="btn sm ghost" id="next">⏭ 下一个</button>
        <button class="btn sm blue" id="reveal">👀 看答案</button>
        <button class="btn sm ghost" id="prevBtn">⏮ 上一个</button>
        <button class="btn sm ghost" id="slow">🐢 慢一点</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
  </div>

  <!-- ========== 完成 ========== -->
  <div id="done">
    <div class="card" style="text-align:center">
      <div style="font-size:52px">🎉</div>
      <h2 style="justify-content:center">听写完成！一共 <span id="dn">0</span> 个字</h2>
      <p class="note" style="margin:0">请家长对照下面的字，帮孩子检查一下～</p>
      <div class="grid" id="grid"></div>
      <div class="row" style="margin-top:16px">
        <button class="btn green" id="again" style="flex:1">🔁 再听一次</button>
      </div>
      <button class="btn ghost" id="back" style="margin-top:10px">← 回到生字表</button>
    </div>
  </div>
</div>

<!-- ========== 补词组面板 ========== -->
<div class="modal" id="modal">
  <div class="modal-box">
    <h3 id="fillTitle">给生字补上组词</h3>
    <p class="note" style="margin:0 0 12px">填一个词语就行，老师会自动念成「善良的善」。第二个词可以不填。</p>
    <div id="fillList"></div>
    <div class="row" style="margin-top:16px">
      <button class="btn ghost" id="fillCancel">取消</button>
      <button class="btn green" id="fillSave">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

const HINTS = {};
HINT_DATA.trim().split(/\n+/).forEach(line=>{
  const p = line.split('|').map(s=>s.trim()).filter(Boolean);
  if(p.length>=2 && p[0].length===1){
    if(!HINTS[p[0]]) HINTS[p[0]] = [p[1], p[2] || p[1]];
  }
});

/* ================= 状态 ================= */
let chars = [];                 // 生字清单（保持输入顺序）
const custom = load('tx_custom_hints', {});   // 自定义提示 {字:[a,b]}
const SET_KEY = 'tx_settings_v3';   // v3：默认 15 秒、不报序号、隔 5 秒重复
const settings = Object.assign({dur:15, gap:5, shuffle:true, twice:true, showHint:true, sayIdx:false, rate:0.85}, load(SET_KEY, {}));

function load(k, d){ try{ return JSON.parse(localStorage.getItem(k)) || d; }catch(e){ return d; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('on'),2200); }

/* ================= 生字表编辑 ================= */
const chipsEl = document.getElementById('chips');
function hintOf(c){ return custom[c] || HINTS[c] || null; }
function wordOf(c, hint){ return String(hint||'').replace(new RegExp('的' + c + '$'), ''); }  // 「善良的善」→「善良」
function missing(){ return chars.filter(c=>!hintOf(c)); }

function renderChips(){
  document.getElementById('cnt').textContent = chars.length + ' 个';
  const miss = missing();
  const tip = document.getElementById('missTip');
  if(miss.length){
    tip.style.display = 'block';
    tip.innerHTML = 'ⓘ 红底的 <b>' + miss.length + '</b> 个字（<b style="color:#E8543F">' + miss.join(' ') + '</b>）还没有组词，听写时只能干念字。点「补词组」填一个词就好，比如「善」填「善良」，老师就会念「善良的善」；不想要的字点 × 删掉。';
  }else{
    tip.style.display = chars.length ? 'none' : 'block';
    tip.innerHTML = '点一个字可以修改它的组词；点 × 删除。每个字都有组词啦 👍';
  }
  const showBtns = chars.length ? 'block' : 'none';
  document.getElementById('fillBtn').style.display = showBtns;
  document.getElementById('clearBtn').style.display = showBtns;
  document.getElementById('dropMissBtn').style.display = (chars.length && miss.length) ? 'block' : 'none';
  if(!chars.length){ chipsEl.innerHTML = '<span class="empty">还没有生字，先上传图片或手动输入～</span>'; return; }
  chipsEl.innerHTML = '';
  chars.forEach((c,i)=>{
    const s = document.createElement('span');
    s.className = 'chip' + (hintOf(c) ? '' : ' miss');
    s.title = hintOf(c) ? ('点击修改组词：' + hintOf(c).join('，')) : '还没有组词，点击补一个';
    s.innerHTML = c + '<span class="x">×</span>';
    s.onclick = (e)=>{
      if(e.target.classList.contains('x')){ chars.splice(i,1); renderChips(); return; }
      openFill([c]);
    };
    chipsEl.appendChild(s);
  });
}

/* 补词组面板：填「善良」→ 自动念成「善良的善」 */
function openFill(only){

function addChars(str){

  let n=0; found.forEach(c=>{ if(!chars.includes(c)){ chars.push(c); n++; } });
  renderChips(); return n;
}

function dedupeCJK(arr){
  const s = new Set(), out = [];
  arr.forEach(c=>{ if(!s.has(c)){ s.add(c); out.push(c); } });
  return out;
}

/* 把整页识别出的「词块」整理成一个个单字位置：
   ① 一次认出多个字的长条 → 按字数横向均分
   ② 太矮的（拼音、噪点）丢掉
   ③ 同一行里挨得近的碎片（如「休」被拆成两半）合并成一个字 */
function buildBoxes(data, w, h){
  const words = (data && data.words) ? data.words : [];
  let list = [];
  words.forEach(o=>{
    if(!o.bbox) return;
    const t = (o.text||'').replace(/[^\u4e00-\u9fff]/g, '');
    if(!t) return;
    const b = o.bbox, bw = b.x1-b.x0, bh = b.y1-b.y0;
    if(bw < 5 || bh < 5) return;
    if(t.length > 1 && bw > bh*1.25){
      const step = bw/t.length;
      for(let i=0;i<t.length;i++){
        list.push({ x0: b.x0+i*step, y0: b.y0, x1: b.x0+(i+1)*step, y1: b.y1 });
      }
    }else{
      list.push({ x0: b.x0, y0: b.y0, x1: b.x1, y1: b.y1 });
    }
  });
  if(!list.length) return [];

  /* 用「第 90 百分位高度」当标准字高，滤掉拼音行和噪点 */
  const hs = list.map(b=>b.y1-b.y0).sort((a,b)=>a-b);
  const maxH = hs[Math.min(hs.length-1, Math.floor(hs.length*0.9))] || 10;
  let arr = list.filter(b=> (b.y1-b.y0) >= maxH*0.55 );
  if(arr.length < 3) arr = list;
  const hs2 = arr.map(b=>b.y1-b.y0).sort((a,b)=>a-b);
  const medH = hs2[Math.floor(hs2.length/2)] || maxH;

  /* 分行 */
  const rows = [];
  arr.sort((a,b)=>a.y0-b.y0);
  arr.forEach(b=>{
    const cy = (b.y0+b.y1)/2;
    let r = rows.find(r=> Math.abs((r.y0+r.y1)/2 - cy) <= medH*0.75 );
    if(!r){ r = { y0:b.y0, y1:b.y1, items:[b] }; rows.push(r); }
    else{ r.items.push(b); r.y0=Math.min(r.y0,b.y0); r.y1=Math.max(r.y1,b.y1); }
  });

  /* 行内合并碎片 */
  const out = [];
  rows.sort((a,b)=>a.y0-b.y0);
  rows.forEach(r=>{
    r.items.sort((a,b)=>a.x0-b.x0);
    let cur = null;
    r.items.forEach(b=>{
      if(!cur){ cur = Object.assign({}, b); return; }
      const gap = b.x0 - cur.x1;
      const mergedW = b.x1 - cur.x0;
      if(gap < medH*0.5 && mergedW < medH*1.9){
        cur.x1 = Math.max(cur.x1, b.x1);
        cur.y0 = Math.min(cur.y0, b.y0); cur.y1 = Math.max(cur.y1, b.y1);
      }else{ out.push(cur); cur = Object.assign({}, b); }
    });
    if(cur) out.push(cur);
  });
  return out.filter(b=> (b.x1-b.x0) >= medH*0.32 && (b.y1-b.y0) >= medH*0.5 )
            .map(b=>({ x0:Math.max(0,Math.round(b.x0)), y0:Math.max(0,Math.round(b.y0)),
                       x1:Math.min(w,Math.round(b.x1)), y1:Math.min(h,Math.round(b.y1)) }));
}

/* 把某个字块裁出来，放大到统一大小，白底 */
function cropCanvas(src, b, pad, targetH){
  const w = src.width, h = src.height;
  const bw = b.x1-b.x0, bh = b.y1-b.y0;
  const px = Math.round(Math.max(bw,bh)*pad);
  const x0 = Math.max(0, b.x0-px), y0 = Math.max(0, b.y0-px);
  const x1 = Math.min(w, b.x1+px), y1 = Math.min(h, b.y1+px);
  const cw = Math.max(1, x1-x0), ch = Math.max(1, y1-y0);
  const s = Math.max(1, Math.min(6, targetH/ch));
  const cv = document.createElement('canvas');
  cv.width = Math.round(cw*s); cv.height = Math.round(ch*s);
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(src, x0,y0,cw,ch, 0,0,cv.width,cv.height);
  return cv;
}

async function runOCR(file){
  const prog = document.getElementById('ocrProg'), bar = document.getElementById('ocrBar'), msg = document.getElementById('ocrMsg');
  prog.style.display='block'; bar.style.width='2%';
  msg.innerHTML = '⏳ 正在加载中文识别引擎（首次约 10–30 秒，之后会快很多）…';
  try{
    await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js');
  }catch(e){
    msg.innerHTML = '❌ 识别引擎加载失败（可能是网络原因）。请直接在下方「粘贴 / 输入生字」里把生字打进去，一样可以用。';
    prog.style.display='none'; return;
  }

  let phase = 'load';
  const logger = m=>{
    if(phase !== 'load') return;
    if(m.progress !== undefined) bar.style.width = Math.round(2 + m.progress*38) + '%';
    msg.innerHTML = '⏳ 正在准备识别引擎… 请不要关闭页面';
  };

  /* 创建识别 worker（langPath 三级回退） */
  const paths = [{}, {langPath:'https://cdn.jsdelivr.net/npm/@tesseract.js-data/chi_sim@1.0.0/4.0.0_best_int'}, {langPath:'https://unpkg.com/@tesseract.js-data/chi_sim/4.0.0_best_int'}];
  let worker = null;
  for(const o of paths){
    try{ worker = await Tesseract.createWorker('chi_sim', 1, Object.assign({logger}, o)); break; }
    catch(err){ console.warn('createWorker retry', err); }
  }
  if(!worker){
    msg.innerHTML = '❌ 识别引擎启动失败，请检查网络，或直接在下方输入框里手动填写生字。';
    prog.style.display='none'; return;
  }
  phase = 'work';
  const setProg = (p, txt)=>{ bar.style.width = p + '%'; msg.innerHTML = '⏳ ' + txt; };

  /* 预处理：放大 + 灰度 + Otsu 二值化 + 去田字格线 + 去噪点 */
  let canvas = file;
  try{ canvas = await preprocess(file); }catch(e){ console.warn('preprocess skip', e); }

  let best = null;

  /* ① 单字模式（最准）：先整页找字块位置 → 逐个裁出来单独识别 → 按置信度过滤 */
  try{
    setProg(42, '正在找生字的位置…');
    await worker.setParameters({ tessedit_pageseg_mode: '11', preserve_interword_spaces: '1' });
    const d1 = await worker.recognize(canvas);
    const boxes = buildBoxes(d1, canvas.width, canvas.height);
    console.log('单字模式：找到字块', boxes.length, '个');
    if(boxes.length >= 3 && boxes.length <= 150){
      await worker.setParameters({ tessedit_pageseg_mode: '10' });   // 单字模式
      const found = [], low = [];
      for(let i=0;i<boxes.length;i++){
        const r = await worker.recognize(cropCanvas(canvas, boxes[i], 0.14, 76));
        const ch = ((r.data.text||'').match(/[\u4e00-\u9fff]/g) || []);
        const cf = r.data.confidence || 0;
        if(ch.length){ found.push(ch[0]); if(cf < 55) low.push(ch[0]); }
        setProg(45 + Math.round(50*(i+1)/boxes.length), '正在逐个认字…（' + (i+1) + '/' + boxes.length + '）');
      }
      if(found.length >= 3) best = { uniq: dedupeCJK(found), label: '单字模式', low: dedupeCJK(low) };
    }
  }catch(err){ console.warn('cell mode fail', err); }

  /* ② 兜底：整页两种模式各跑一遍，取认出不重复汉字较多的一版 */
  if(!best){
    setProg(50, '正在整页认字…');
    for(const [psm, label] of [['6','整页模式'], ['11','散字模式']]){
      try{
        await worker.setParameters({ tessedit_pageseg_mode: psm, preserve_interword_spaces: '1' });
        const { data } = await worker.recognize(canvas);
        const uniq = dedupeCJK((data.text||'').match(/[\u4e00-\u9fff]/g) || []);
        console.log('PSM', psm, label, '认出', uniq.length, '字:', uniq.join(''));
        if(!best || uniq.length > best.uniq.length) best = { uniq, label, low: [] };
      }catch(err){ console.warn('pass fail', psm, err); }
    }
  }
  try{ await worker.terminate(); }catch(e){}

  bar.style.width='100%';
  if(best && best.uniq.length){
    const n = addChars(best.uniq.join(''));
    let extra = '';
    if(best.low && best.low.length){
      extra = '<br>⚠️ 这 <b style="color:#E8543F">' + best.low.join(' ') + '</b> 几个把握不大，请重点核对。';
    }
    msg.innerHTML = '✅ 识别出 <b>' + n + '</b> 个生字（' + best.label + '，按生字表顺序），已加入清单。'
      + '<b style="color:#E8543F">请务必逐个核对！</b>认错/多认的点一下改、点 × 删。'
      + extra
      + '<br>楷体字仍可能认错，最稳的办法：把生字表照片发到 WorkBuddy 对话框里，老师帮你转成文字，复制粘贴回来。';
  }else{
    msg.innerHTML = '⚠️ 没认出字来。可以换一张更清楚的照片（正对着拍、光线足、字占画面大），或把照片发到 WorkBuddy 对话框里让老师帮忙转文字，再粘贴回来。';
  }
  setTimeout(()=>{ prog.style.display='none'; }, 600);
}

/* 图片预处理：放大 → 灰度 → Otsu 二值化（去彩色底） → 去田字格线 → 去孤立噪点 */
function preprocess(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>{
      const w = img.naturalWidth, h = img.naturalHeight, mx = Math.max(w,h);
      const scale = mx < 1400 ? Math.min(3, 1400/mx) : (mx > 2400 ? 2400/mx : 1);
      const cv = document.createElement('canvas');
      cv.width = Math.round(w*scale); cv.height = Math.round(h*scale);
      const ctx = cv.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(img, 0, 0, cv.width, cv.height);
      try{ binarize(ctx, cv.width, cv.height); }
      catch(e){ console.warn('binarize skip', e); }
      resolve(cv);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

/* 灰度 + Otsu 二值化，返回 ink 掩码（1 = 笔画） */
function binarize(ctx, w, h){
  const d = ctx.getImageData(0, 0, w, h), n = w*h;
  const gray = new Uint8Array(n);
  for(let i=0;i<n;i++){ gray[i] = (d.data[i*4]*0.299 + d.data[i*4+1]*0.587 + d.data[i*4+2]*0.114) | 0; }
  const th = otsu(gray);
  const bin = new Uint8Array(n);
  for(let i=0;i<n;i++){ bin[i] = gray[i] > th ? 0 : 1; }
  removeGridLines(bin, w, h);
  despeckle(bin, w, h);
  for(let i=0;i<n;i++){ const v = bin[i] ? 0 : 255; d.data[i*4]=d.data[i*4+1]=d.data[i*4+2]=v; d.data[i*4+3]=255; }
  ctx.putImageData(d, 0, 0);
}

/* 去掉田字格线：只删「几乎贯穿整幅 + 有很长连续段」的行/列，
   这样能擦掉格子线，又不会误删字的横竖笔画（字的笔画都是短段） */
function removeGridLines(bin, w, h){
  const minRun = w*0.15, need = w*0.55;
  for(let y=0;y<h;y++){
    let cnt=0, run=0, maxRun=0;
    const base = y*w;
    for(let x=0;x<w;x++){
      if(bin[base+x]){ cnt++; run++; if(run>maxRun) maxRun=run; } else run=0;
    }
    if(cnt > need && maxRun > minRun){ for(let x=0;x<w;x++) bin[base+x]=0; }
  }
  const minRun2 = h*0.15, need2 = h*0.55;
  for(let x=0;x<w;x++){
    let cnt=0, run=0, maxRun=0;
    for(let y=0;y<h;y++){
      if(bin[y*w+x]){ cnt++; run++; if(run>maxRun) maxRun=run; } else run=0;
    }
    if(cnt > need2 && maxRun > minRun2){ for(let y=0;y<h;y++) bin[y*w+x]=0; }
  }
}

/* 去孤立噪点：周围（8 邻域）黑点少于 2 个的，当成噪点擦掉 */
function despeckle(bin, w, h){
  for(let pass=0; pass<2; pass++){
    const cp = bin.slice();
    let changed = false;
    for(let y=1;y<h-1;y++){
      const b = y*w;
      for(let x=1;x<w-1;x++){
        const i = b+x;
        if(!cp[i]) continue;
        const c = cp[i-1]+cp[i+1]+cp[i-w]+cp[i+w]+cp[i-w-1]+cp[i-w+1]+cp[i+w-1]+cp[i+w+1];
        if(c <= 1){ bin[i]=0; changed = true; }
      }
    }
    if(!changed) break;
  }
}
function otsu(g){
  const hist = new Array(256).fill(0);
  for(let i=0;i<g.length;i++) hist[g[i]]++;
  const total = g.length;
  let sum = 0; for(let i=0;i<256;i++) sum += i*hist[i];
  let sumB = 0, wB = 0, best = 0, th = 127;
  for(let t=0;t<256;t++){
    wB += hist[t]; if(!wB) continue;
    const wF = total - wB; if(!wF) break;
    sumB += t*hist[t];
    const mB = sumB/wB, mF = (sum-sumB)/wF;
    const between = wB*wF*(mB-mF)*(mB-mF);
    if(between > best){ best = between; th = t; }
  }
  return th;
}

let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices() || [];
  voice = vs.find(v=>/zh[-_]CN/i.test(v.lang) && /Ting|Tingting|Mei|Yu|Female|女/i.test(v.name))
       || vs.find(v=>/zh[-_]CN/i.test(v.lang))
       || vs.find(v=>/^zh/i.test(v.lang)) || null;
}

/* 依次朗读多句话。要点：
   1) cancel() 之后必须等一拍再 speak，否则 Safari/Chrome 会把新语音吞掉
   2) 用 onend 串起来，不走「同时排队两个 utterance」的老办法
   3) 全程不使用 WebAudio —— iPhone 上 AudioContext 会打断语音合成，导致只念出开头几个字 */
let speechSeq = 0, speakTimer = null;
function speak(texts, rate){
  if(!('speechSynthesis' in window)) return;
  if(typeof texts === 'string') texts = [texts];
  const mySeq = ++speechSeq;
  clearTimeout(speakTimer);
  try{ speechSynthesis.cancel(); }catch(e){}
  try{ speechSynthesis.resume(); }catch(e){}
  const go = (i)=>{
    if(mySeq !== speechSeq) return;               // 已经被新的一次朗读取代
    if(i >= texts.length){ document.getElementById('spk').textContent = ''; return; }
    const u = new SpeechSynthesisUtterance(texts[i]);
    u.lang = 'zh-CN'; u.rate = rate ?? settings.rate; u.pitch = 1.05; u.volume = 1;
    if(voice) u.voice = voice;
    if(i === 0) u.onstart = ()=>{ document.getElementById('spk').textContent = '🔊 老师在念，仔细听～'; };
    u.onend = ()=> go(i+1);
    u.onerror = ()=> go(i+1);
    try{ speechSynthesis.speak(u); }catch(e){ go(i+1); }
  };
  speakTimer = setTimeout(()=> go(0), 80);
}

/* ================= 听写流程 ================= */
let order = [], idx = 0, remain = 0, last = 0, raf = null, paused = false, running = false, revealed = false;

function scriptFor(ch, withIdx){
  const hs = (hintOf(ch) || []).filter(Boolean);
  let s = '';
  if(withIdx) s += '第' + (idx+1) + '个，';

  else s += ch + '，' + ch + '。';           // 实在没有组词时，只念两遍字
  return s;
}

  document.getElementById('run').style.display='block';
  if('speechSynthesis' in window) speechSynthesis.resume();
  try{ navigator.wakeLock && navigator.wakeLock.request('screen'); }catch(e){}
  renderDots(); show(true);
}

function show(isNew){
  if(idx>=order.length){ finish(); return; }
  const ch = order[idx];
  revealed = false;
  document.getElementById('pos').textContent = '第 ' + (idx+1) + ' / ' + order.length + ' 个';
  document.getElementById('box').innerHTML = '<span class="pen">✍️</span>';
  const hs = (hintOf(ch) || []).filter(Boolean);
  const hintEl = document.getElementById('hint');
  if(settings.showHint && hs.length) hintEl.innerHTML = hs.join('<br>') + '<br><span class="dim">把它写在本子上</span>';
  else hintEl.innerHTML = '<span class="dim">仔细听老师念，写在本子上</span>';
  document.getElementById('pause').textContent = '⏸ 暂停';
  paused = false;
  updateDots();
  curText = scriptFor(ch, settings.sayIdx);
  repeated = false;                       // 第一遍马上念
  speak([curText]);
  remain = settings.dur * 1000; last = 0;
  if(raf) cancelAnimationFrame(raf);
  raf = requestAnimationFrame(tick);
}

function tick(ts){
  if(!running) return;
  if(!last) last = ts;
  if(!paused){
    remain -= (ts - last);
    // 隔 N 秒再念一遍（只念一次，不会一直重复）
    if(!repeated && settings.twice){
      const elapsed = settings.dur*1000 - remain;
      if(elapsed >= gapMs()){ repeated = true; speak([curText]); }
    }
    if(remain <= 0){
      remain = 0; paint();
      idx++; if(idx>=order.length){ setTimeout(finish, 400); return; }
      setTimeout(()=>{ if(running) show(true); }, 500);
      return;
    }
  }
  last = ts; paint(); raf = requestAnimationFrame(tick);
}
const C = 2*Math.PI*27;
function paint(){
  const total = settings.dur*1000;
  const k = Math.max(0, Math.min(1, remain/total));
  document.getElementById('num').textContent = Math.ceil(remain/1000);
  document.getElementById('ring').setAttribute('stroke-dashoffset', (C*(1-k)).toFixed(1));
  document.getElementById('ring').setAttribute('stroke', k<0.25 ? '#FF6B6B' : '#FF8A3D');
}
function renderDots(){
  document.getElementById('dots').innerHTML = order.map(()=>'<i></i>').join('');
}
function updateDots(){
  const ds = document.getElementById('dots').children;
  for(let i=0;i<ds.length;i++){ ds[i].className = i<idx ? 'done' : (i===idx ? 'cur' : ''); }
}
function finish(){
  running = false; if(raf) cancelAnimationFrame(raf);
  if('speechSynthesis' in window){ speechSynthesis.cancel(); }
  speak('听写完成，请家长帮忙检查一下。', 0.9);
  document.getElementById('run').style.display='none';
  document.getElementById('done').style.display='block';
  document.getElementById('dn').textContent = order.length;
  const g = document.getElementById('grid'); g.innerHTML='';
  order.forEach((c,i)=>{ const d=document.createElement('div'); d.className='cell'; d.innerHTML='<u>'+(i+1)+'</u>'+c; g.appendChild(d); });
}

/* 控制按钮 */
document.getElementById('start').onclick = start;
document.getElementById('test').onclick = (e)=>{ e.target.textContent='🔊 正在试听…'; speak(['大海的海，海边的海。']); setTimeout(()=>{e.target.textContent='🔊 先试听一下语音';},2500); };
document.getElementById('fillBtn').onclick = ()=> openFill();
document.getElementById('dropMissBtn').onclick = ()=>{
  const miss = missing();
  if(!miss.length) return;
  if(confirm('把 ' + miss.length + ' 个还没有组词的字（' + miss.join(' ') + '）从清单里移除？')){
    chars = chars.filter(c=>hintOf(c));
    renderChips(); save('tx_chars', chars);
    toast('已移除 ' + miss.length + ' 个字');
  }
};
document.getElementById('clearBtn').onclick = ()=>{
  if(chars.length && confirm('清空整个生字清单？组词提示会保留。')){ chars = []; renderChips(); save('tx_chars', chars); toast('已清空'); }
};
document.getElementById('fillCancel').onclick = closeFill;
document.getElementById('fillSave').onclick = saveFill;
document.getElementById('modal').onclick = (e)=>{ if(e.target.id==='modal') closeFill(); };
document.getElementById('repeat').onclick = ()=>{ speak([curText]); };
document.getElementById('slow').onclick = ()=>{ speak([curText], Math.max(0.5, settings.rate-0.2)); toast('慢速再念一遍'); };
document.getElementById('next').onclick = ()=>{ if(idx<order.length-1){ idx++; show(true); } else finish(); };
document.getElementById('prevBtn').onclick = ()=>{ if(idx>0){ idx--; show(true); } };
document.getElementById('pause').onclick = (e)=>{
  paused = !paused;
  e.target.textContent = paused ? '▶ 继续' : '⏸ 暂停';
  if(paused){ if('speechSynthesis' in window) speechSynthesis.pause(); }
  else { if('speechSynthesis' in window) speechSynthesis.resume(); last = 0; }
};
document.getElementById('reveal').onclick = (e)=>{
  revealed = !revealed;
  document.getElementById('box').innerHTML = revealed
    ? '<span class="ans">'+order[idx]+'</span>'
    : '<span class="pen">✍️</span>';
  e.target.textContent = revealed ? '🙈 藏起来' : '👀 看答案';
};
document.getElementById('quit').onclick = ()=>{ if(confirm('结束这次听写吗？')) finish(); };
document.getElementById('again').onclick = start;
document.getElementById('back').onclick = ()=>{
  document.getElementById('done').style.display='none';
  document.getElementById('setup').style.display='block';
};

/* 初始化 */
chars = load('tx_chars', []);
renderChips();
window.addEventListener('beforeunload', ()=> save('tx_chars', chars));
</script>
